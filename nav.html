<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap');

        * {
            padding: 0;
            margin: 0%;
        }

        body {
            font-family: "Archivo Black", sans-serif;
        }

        nav {
            display: flex;
            justify-content: center;
            /* background-color: black; */
            border-bottom: 1px solid black;
        }

        .nav-items {
            width: 80%;
            /* background-color: rgb(144, 123, 4); */
            display: flex;
            justify-content: space-between;
            align-items: center; /*aligns items vertically at the centre*/
        }

        .nav-items ul {
            display: flex;
            list-style-type: none;
        }
        .nav-items li{
            margin-right: 16px;
            margin-left: 16px;
        }
        .nav-items a{
            text-decoration: none;
            color: black;
            text-transform: capitalize;
        }
        .nav-items a:hover{
            color: burlywood;
            text-decoration: underline;
        }
        .nav-items img{
         width: 48px;
         height: 48px;   
        }
    </style>
</head>

<body>
    <nav>
        <!-- semantic tags - navigation tags div represented by nav tag -->
        <div class="nav-items">
            <img src="images/summer.png" alt="Company logo">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Team</a></li>
                <li><a href="#">Pricing</a></li>
                <li><a href="#">Contact us</a></li>
            </ul>
        </div>
    </nav>
</body>

</html>
