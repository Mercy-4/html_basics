<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <style>

        body {
            background: #220122;
            font-family: "Fira Sans", sans-serif;
            ;
        }

        form {
            width: 25%;
            border: 1px solid rgb(142, 4, 170);
            padding: 12px;
            color: #ffffff;
            margin: auto;
            /* margin auto makes the distance on the left and right equal so the content is in the centre */
.meck{
    display: block; /*makes your element stretch the whole width*/  
    
}
.candy{
    width: 100%; /*occupies the whole available space*/
    padding: 12px;
    box-sizing: border-box; /* makes sure the content doesnt overshoot outside the border after adding padding*/
    margin-bottom: 12px; /* adds space between elements*/
}
        }
    </style>
</head>

<body>
    <!--form inputs text, email, password, phone, date, radio button, chekbox, select  -->
    <form action="">
        <label class="meck" for="full_name">Full Name</label>
        <input class="candy" type="text" name="full_name" id="full_name" placeholder="Enter your name" required>

        <label class="meck" for="email">Enter your email</label>
        <input class="candy" type="email" name="email" id="email" placeholder="Enter your rmail">
        <label class="meck" for="password">Enter your password</label>
        <input class="candy" type="password" name="password" id="password" placeholder="Enter your password" required>

        <label class="meck" for="phone">Phone</label>
        <input class="candy" type="tel" name="phone" id="phone" placeholder="Enter phone number">

        <label class="meck" for="dob">Date of birth</label>
        <input class="candy" type="date" name="dob" id="dob" placeholder="Enter DoB" required min="1930-01-01" max="2008-01-01">

        <label class="meck" for="female">Select gender</label>

        <input type="radio" name="gender" id="male" value="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female" value="female" checked>
        <label for="female">Female</label>
        <br>
<p>Select favourite sport</p>
        <input type="checkbox" name="Tennis" id="tennis" value="tennis">
        <label for="tennis">Tennis</label>
<br>
        <input type="checkbox" name="Basketball" id="basketball" value="basketball">
        <label for="tennis">Basketball</label>
<br>
        <input type="checkbox" name="Football" id="football" value="football">
        <label for="football">Football</label>
<br><br>
        <label class="meck" for="county">Select county</label>
        <select class="candy" name="county" id="county" required>
            <option value="Nairobi">Nairobi</option>
            <option value="Nyeri">Nyeri</option>
            <option value="Mombasa">Mombasa</option>
        </select>


        <button class="meck" type="submit">Submit</button>


    </form>
</body>

</html>
